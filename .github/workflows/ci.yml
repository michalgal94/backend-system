name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest job_service/tests processor_service/tests audit_service/tests -q

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [job_service, processor_service, audit_service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: document-processing/${{ matrix.service }}:${{ github.sha }}
