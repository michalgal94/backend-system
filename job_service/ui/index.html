<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Processing System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div><p class="eyebrow">REAL-TIME OPERATIONS</p><h1>Document Processing System</h1></div>
    <a class="docs-link" href="/docs" target="_blank" rel="noreferrer">Job API docs ↗</a>
  </header>

  <main>
    <section class="service-bar" aria-label="Service health">
      <div class="service"><span id="job-health" class="dot"></span><strong>Job Service</strong><small>8000</small></div>
      <div class="service"><span id="processor-health" class="dot"></span><strong>Processor Service</strong><small>8001</small></div>
      <div class="service"><span id="audit-health" class="dot"></span><strong>Audit Service</strong><small>8002</small></div>
      <button id="refresh-health" class="text-button">Refresh services</button>
    </section>

    <div id="notice" class="notice" role="status" hidden></div>

    <div class="layout">
      <section class="card create-card">
        <div class="section-heading"><div><p class="eyebrow">NEW REQUEST</p><h2>Create processing job</h2></div></div>
        <form id="create-form">
          <label>Title <input id="title" maxlength="200" placeholder="e.g. September contracts"></label>
          <label>Tags <input id="tags" maxlength="500" placeholder="e.g. legal, priority"></label>
          <div class="form-heading"><span>Documents</span><button id="add-document" type="button" class="text-button">+ Add document</button></div>
          <div id="documents"></div>
          <button class="primary" type="submit">Start processing</button>
        </form>
      </section>

      <section class="card jobs-card">
        <div class="section-heading"><div><p class="eyebrow">ACTIVITY</p><h2>Jobs</h2></div><button id="refresh-jobs" class="text-button">Refresh</button></div>
        <div id="jobs" class="jobs-list"><p class="muted">Loading jobs…</p></div>
      </section>
    </div>

    <section id="details-card" class="card details-card" hidden>
      <div class="section-heading"><div><p class="eyebrow">JOB DETAILS</p><h2 id="detail-title">Untitled job</h2></div><span id="detail-status" class="status"></span></div>
      <p id="detail-id" class="identifier"></p>
      <div class="metadata-form">
        <label>Title <input id="edit-title" maxlength="200"></label>
        <label>Tags <input id="edit-tags" maxlength="500"></label>
        <button id="save-metadata" class="secondary">Save metadata</button>
      </div>
      <div id="detail-error" class="error" hidden></div>
      <div id="audit-result" class="audit-result"></div>
      <div id="results" class="results"></div>
    </section>
  </main>
  <template id="document-template">
    <div class="document-input">
      <label>Document ID <input class="document-id" maxlength="200" required placeholder="document-1"></label>
      <label>Document text <textarea class="document-text" required maxlength="1000000" placeholder="Paste document text here"></textarea></label>
      <button type="button" class="remove-document text-button">Remove</button>
    </div>
  </template>
  <script src="app.js"></script>
</body>
</html>
