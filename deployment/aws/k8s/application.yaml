apiVersion: v1
kind: Namespace
metadata:
  name: document-processing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: document-processing-config
  namespace: document-processing
data:
  PROCESSOR_URL: http://processor-service:8001
  AUDIT_URL: http://audit-service:8002
  JOB_EVENTS_WS_URL: ws://job-service:8000/ws/events
  MAX_CONCURRENT_JOBS: "10"
  MAX_CONCURRENT_DOCUMENTS: "32"
---
apiVersion: v1
kind: Service
metadata:
  name: job-service
  namespace: document-processing
spec:
  selector: { app: job-service }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-service
  namespace: document-processing
spec:
  replicas: 2
  selector: { matchLabels: { app: job-service } }
  template:
    metadata: { labels: { app: job-service } }
    spec:
      containers:
        - name: job-service
          image: REPLACE_AWS_ACCOUNT.dkr.ecr.REPLACE_REGION.amazonaws.com/job-service:REPLACE_TAG
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: document-processing-config } }]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 15 }
---
apiVersion: v1
kind: Service
metadata:
  name: processor-service
  namespace: document-processing
spec:
  selector: { app: processor-service }
  ports: [{ port: 8001, targetPort: 8001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor-service
  namespace: document-processing
spec:
  replicas: 2
  selector: { matchLabels: { app: processor-service } }
  template:
    metadata: { labels: { app: processor-service } }
    spec:
      containers:
        - name: processor-service
          image: REPLACE_AWS_ACCOUNT.dkr.ecr.REPLACE_REGION.amazonaws.com/processor-service:REPLACE_TAG
          ports: [{ containerPort: 8001 }]
          envFrom: [{ configMapRef: { name: document-processing-config } }]
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          readinessProbe: { httpGet: { path: /health, port: 8001 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: document-processing
spec:
  selector: { app: audit-service }
  ports: [{ port: 8002, targetPort: 8002 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: document-processing
spec:
  replicas: 2
  selector: { matchLabels: { app: audit-service } }
  template:
    metadata: { labels: { app: audit-service } }
    spec:
      containers:
        - name: audit-service
          image: REPLACE_AWS_ACCOUNT.dkr.ecr.REPLACE_REGION.amazonaws.com/audit-service:REPLACE_TAG
          ports: [{ containerPort: 8002 }]
          envFrom: [{ configMapRef: { name: document-processing-config } }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe: { httpGet: { path: /health, port: 8002 }, initialDelaySeconds: 5 }
